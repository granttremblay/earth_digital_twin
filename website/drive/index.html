<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taking you to the shared Google Drive…</title>
  <meta name="robots" content="noindex" />

  <!-- Redirect stub for https://livingearthtwin.org/drive -->
  <!-- meta refresh is the no-JS path; the <script> at the bottom is the fast path. -->
  <meta http-equiv="refresh" content="0; url=https://drive.google.com/drive/folders/1zmbn8_Kkcw_t2zpdA0aUEEN4FAHLy5u-?usp=sharing" />
  <link rel="canonical" href="https://drive.google.com/drive/folders/1zmbn8_Kkcw_t2zpdA0aUEEN4FAHLy5u-?usp=sharing" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-0: #05070d;
      --ink: #e7ecf7;
      --ink-dim: #a7b1c4;
      --ink-mute: #6c7691;
      --accent: #3ee1c8;
      --line: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg-0);
      color: var(--ink);
      font-family: 'DM Sans', 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 520px; }

    .mark { width: 92px; margin: 0 auto 26px; opacity: 0.92; }

    .eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(21px, 4vw, 28px);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    p { color: var(--ink-dim); margin-top: 12px; font-size: 15px; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 999px;
      background: linear-gradient(120deg, #3ee1c8, #7cc7ff);
      color: #05070d;
      font-weight: 600;
      font-size: 15px;
    }

    .btn:hover { text-decoration: none; filter: brightness(1.08); }

    .home {
      display: block;
      margin-top: 28px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-mute);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <img class="mark" src="../assets/digital_earth_logo_primary.svg" alt="" />
    <div class="eyebrow">Living Earth Digital Twin</div>
    <h1>Taking you to the shared Google Drive…</h1>
    <p>If your browser doesn't move on its own, use the link below.</p>
    <a class="btn" href="https://drive.google.com/drive/folders/1zmbn8_Kkcw_t2zpdA0aUEEN4FAHLy5u-?usp=sharing">Open the Google Drive &rarr;</a>
    <a class="home" href="../">livingearthtwin.org</a>
  </div>

  <script>
    // replace() so the stub doesn't sit in the back-button history
    location.replace('https://drive.google.com/drive/folders/1zmbn8_Kkcw_t2zpdA0aUEEN4FAHLy5u-?usp=sharing');
  </script>
</body>

</html>
